[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchess"
version = "0.1.0"
description = "Chess benchmark for LLM agents: round-robin tournaments, engine anchors and Elo ratings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chess>=1.10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pyyaml>=6",
  "anthropic>=0.40",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentchess = "agentchess.cli:main"

[tool.setuptools.packages.find]
include = ["agentchess*"]

[tool.setuptools.package-data]
agentchess = ["web/**/*", "data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
